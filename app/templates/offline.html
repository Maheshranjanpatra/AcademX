{% extends "base.html" %}
{% block title %}Offline - Nymora{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4">
    <span class="text-6xl mb-4">📡</span>
    <h1 class="font-display text-headline-lg text-on-surface">You're Offline</h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-md">
        Don't worry! Your doubts and progress are safe. Connect to the internet and reload.
    </p>
    <button onclick="location.reload()" class="mt-6 bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-lg hover:bg-surface-tint transition-all">
        Reload ↻
    </button>
</div>
{% endblock %}
