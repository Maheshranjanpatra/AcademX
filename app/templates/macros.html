{% macro user_avatar(user, size='w-8 h-8') %}
    {% set avatar_file = (user.avatar or 'avatar7.png').replace('.png', '.webp') %}
    <div class="{{ size }} rounded-full overflow-hidden border border-primary-fixed/20 bg-gray-100 flex-shrink-0">
        <img src="{{ url_for('static', filename='images/profiles/' + avatar_file) }}"
             alt="{{ user.name }}"
             class="w-full h-full object-cover">
    </div>
{% endmacro %}
