{% extends "admin/layout.html" %}

{% block title %}Add Question - Nymora Admin{% endblock %}
{% block page_title %}Add Question to Quiz{% endblock %}

{% block content %}
<div class="admin-card" style="max-width: 600px;">
    <form method="POST" action="">
        {{ form.hidden_tag() if form }}

        <div class="form-group">
            <label class="form-label">Question Text</label>
            <textarea name="question_text" class="form-textarea" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Option A</label>
            <input type="text" name="option_a" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Option B</label>
            <input type="text" name="option_b" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Option C</label>
            <input type="text" name="option_c" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Option D</label>
            <input type="text" name="option_d" class="form-input" required>
        </div>

        <div class="form-group">
            <label class="form-label">Correct Option</label>
            <select name="correct_option" class="form-select" required>
                <option value="A">Option A</option>
                <option value="B">Option B</option>
                <option value="C">Option C</option>
                <option value="D">Option D</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Explanation</label>
            <textarea name="explanation" class="form-textarea" rows="3"></textarea>
        </div>

        <div class="flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Add Question</button>
            <a href="{{ url_for('admin.quizzes') }}" class="btn btn-secondary">Cancel</a>
            <a href="{{ url_for('admin.bulk_import_questions', quiz_id=quiz.id) }}" class="btn btn-secondary">
                <span class="material-symbols-outlined">upload_file</span>
                Import from CSV
            </a>
        </div>
    </form>
</div>
{% endblock %}
